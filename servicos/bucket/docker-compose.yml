services:
  minio:
    image: pgsty/minio:latest
    container_name: minio
    ports:
      - "9000:9000" #API
      - "9001:9001" #CONSOLE_WEB
    volumes:
      - ./docs:/data
    environment:
      MINIO_ROOT_USER: myadmin
      MINIO_ROOT_PASSWORD: mypassword123
    command: server /data --console-address ":9001"
    restart: unless-stopped